<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Precense</title>
<meta name="theme-color" content="#f7f3ec" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
<link rel="stylesheet" href="/app/app.css" />
</head>
<body class="app-body">

<main id="view" class="app-view"></main>

<nav class="floating-nav" id="nav">
  <a href="#home" data-view="home" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </a>
  <a href="#saved" data-view="saved" aria-label="Saved">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    <span>Saved</span>
  </a>
  <a href="#profile" data-view="profile" aria-label="Profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
    <span>Profile</span>
  </a>
</nav>

<template id="tpl-home">
  <section class="app-section reveal in">
    <header class="app-header">
      <a class="brand-mini" href="/"><span class="brand-dot"></span><span>Precense</span></a>
      <a class="settings-link" href="#settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </header>

    <div class="greeting reveal">
      <div class="eyebrow" data-greeting-eyebrow>WELCOME BACK</div>
      <h1 class="display" data-greeting>
        <span data-greeting-name>Jah</span>,<br/>
        what did you <em>post?</em>
      </h1>
    </div>

    <form class="pill-input hero-pill reveal" onsubmit="event.preventDefault(); handlePrompt(this);">
      <input type="text" placeholder="Paste a video link or ask Precense…" aria-label="Ask Precense" />
      <button class="pill-input-send" type="submit" aria-label="Send">↑</button>
    </form>

    <div class="chip-row reveal" id="quick-chips">
      <button class="chip" onclick="setPromptText(this)">Why did my last one flop?</button>
      <button class="chip" onclick="setPromptText(this)">What should I make today?</button>
      <button class="chip" onclick="setPromptText(this)">Give me 3 hooks for tomorrow</button>
      <button class="chip" onclick="setPromptText(this)">What's my strongest format?</button>
      <button class="chip" onclick="setPromptText(this)">Rate my last week</button>
    </div>

    <div class="section-title reveal">
      <div class="eyebrow">FOR YOU</div>
      <h2 class="h3-serif">Recent teardowns</h2>
    </div>

    <div class="card-carousel reveal" id="feed"></div>

    <div class="empty-hint reveal" id="empty-hint" hidden>
      <p>You haven't forwarded a video yet. Open <a href="https://t.me/getprecense_bot" target="_blank" rel="noopener">@getprecense_bot</a> in Telegram and send Precense any reel to get your first teardown.</p>
    </div>
  </section>
</template>

<template id="tpl-profile">
  <section class="app-section reveal in">
    <header class="app-header">
      <a class="brand-mini" href="#home"><span class="brand-dot"></span><span>Precense</span></a>
    </header>

    <div class="profile-hero reveal">
      <div class="profile-avatar" data-profile-initial>P</div>
      <h1 class="display">The more Precense sees,<br/>the <em>sharper</em> it gets.</h1>
      <p class="lede">Every video you forward teaches your signature. Here's what Precense has learned about you so far.</p>
    </div>

    <div class="settings-group-title">THE BASICS</div>
    <div class="settings-group reveal">
      <div class="settings-row">
        <div class="settings-row-label">Name</div>
        <div class="settings-row-value" data-profile-name>—</div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Handle</div>
        <div class="settings-row-value" data-profile-handle>—</div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Niche</div>
        <div class="settings-row-value"><span data-profile-niche>app-ugc</span> <span class="settings-row-chev">›</span></div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Videos analyzed</div>
        <div class="settings-row-value"><span data-profile-count>0</span></div>
      </div>
    </div>

    <div class="settings-group-title">YOUR SIGNATURE</div>
    <div class="signature-card card reveal">
      <div class="sig-row">
        <div class="sig-label">Dominant hooks</div>
        <div class="sig-chips" data-sig-hooks></div>
      </div>
      <hr class="hairline" />
      <div class="sig-row">
        <div class="sig-label">Dominant formats</div>
        <div class="sig-chips" data-sig-formats></div>
      </div>
      <hr class="hairline" />
      <div class="sig-row">
        <div class="sig-label">Common subjects</div>
        <div class="sig-chips" data-sig-subjects></div>
      </div>
      <hr class="hairline" />
      <div class="sig-row">
        <div class="sig-label">Top performers</div>
        <div class="sig-perf" data-sig-perf></div>
      </div>
    </div>

    <div class="settings-group-title">CHANNELS</div>
    <div class="settings-group reveal">
      <div class="settings-row">
        <div class="settings-row-label">Telegram</div>
        <div class="settings-row-value"><span class="badge-soft">Live</span></div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">WhatsApp</div>
        <div class="settings-row-value"><span class="badge-soft badge-gold">Soon</span></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-settings">
  <section class="app-section reveal in">
    <header class="app-header">
      <a class="brand-mini" href="#home"><span class="brand-dot"></span><span>Precense</span></a>
    </header>

    <div class="greeting reveal">
      <div class="eyebrow">SETTINGS</div>
      <h1 class="display">Fine-<em>tune</em>.</h1>
    </div>

    <div class="settings-group-title">SUBSCRIPTION</div>
    <div class="settings-group reveal">
      <div class="settings-row">
        <div class="settings-row-label">Plan</div>
        <div class="settings-row-value">Waitlist · early access</div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Model</div>
        <div class="settings-row-value">Claude Haiku 4.5</div>
      </div>
    </div>

    <div class="settings-group-title">LEGAL</div>
    <div class="settings-group reveal">
      <div class="settings-row">
        <div class="settings-row-label">Terms of Service</div>
        <div class="settings-row-value settings-row-chev">›</div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Privacy Policy</div>
        <div class="settings-row-value settings-row-chev">›</div>
      </div>
    </div>

    <div class="settings-group-title">DANGER ZONE</div>
    <div class="settings-group reveal">
      <div class="settings-row" onclick="openSheet('delete')">
        <div class="settings-row-label settings-row-danger">Delete account</div>
        <div class="settings-row-value settings-row-chev">›</div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-saved">
  <section class="app-section reveal in">
    <header class="app-header">
      <a class="brand-mini" href="#home"><span class="brand-dot"></span><span>Precense</span></a>
    </header>
    <div class="greeting reveal">
      <div class="eyebrow">SAVED</div>
      <h1 class="display">Your <em>keepers</em>.</h1>
      <p class="lede">Cards you've hearted show up here. Tap any card in your feed to save it.</p>
    </div>
    <div class="empty-hint reveal">
      <p>Nothing saved yet.</p>
    </div>
  </section>
</template>

<!-- Bottom sheet (Delete confirm) -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet" role="dialog" aria-hidden="true">
  <div class="sheet-icon">⚠</div>
  <h2 class="sheet-title">Delete account?</h2>
  <p class="sheet-body">This wipes your signature, every teardown, and unlinks the bot. Not reversible.</p>
  <button class="btn btn-primary sheet-cta" onclick="closeSheet()">Keep my account</button>
  <span class="sheet-not-now" onclick="closeSheet()">Actually delete</span>
</aside>

<script src="/app/app.js"></script>
</body>
</html>
