<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Precense</title>
<meta name="theme-color" content="#0f2e22" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="stylesheet" href="/styles/components.css" />
<link rel="stylesheet" href="/app/app.css" />
</head>
<body class="app-body">

<div class="shell">
  <!-- SIDEBAR (desktop) -->
  <aside class="side">
    <a class="side-brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 160 160" width="32" height="32"><g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M 28 46 L 28 28 L 46 28"/><path d="M 132 46 L 132 28 L 114 28"/><path d="M 28 114 L 28 132 L 46 132"/><path d="M 132 114 L 132 132 L 114 132"/></g><text x="80" y="104" text-anchor="middle" font-family="'Instrument Serif','Times New Roman',serif" font-style="italic" font-size="82" fill="currentColor">P</text></svg></span>
      <span class="brand-word">Precense</span>
    </a>
    <nav class="side-nav" id="side-nav"><!-- populated by app.js based on role --></nav>

    <div class="side-foot">
      <a class="side-user" href="#profile" data-view="profile">
        <span class="side-user-avatar" data-profile-initial>P</span>
        <span class="side-user-meta">
          <span class="side-user-name" data-side-name>—</span>
          <span class="side-user-handle" data-side-handle>@—</span>
        </span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="view" class="main"></main>
</div>

<!-- FLOATING NAV (mobile only, hidden on desktop via CSS) -->
<nav class="floating-nav" id="mobile-nav"><!-- populated by app.js based on role --></nav>

<!-- ---------- TEMPLATES ---------- -->

<template id="tpl-home-legacy">
  <div class="page-grid">
    <section class="page-main">
      <div class="hero-block reveal in">
        <div class="eyebrow">TODAY · <span data-today>—</span></div>
        <h1 class="h1-lg">Hey <span data-greeting-name>friend</span>, what did you <em>post?</em></h1>
      </div>

      <form class="pill-input reveal" onsubmit="event.preventDefault(); handlePrompt(this);">
        <input type="text" placeholder="Paste a video link or ask Precense a question…" aria-label="Ask Precense" />
        <button class="pill-input-send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </form>

      <div class="chip-row reveal">
        <button class="chip" onclick="setPromptText(this)">Why did my last one flop?</button>
        <button class="chip" onclick="setPromptText(this)">What should I make today?</button>
        <button class="chip" onclick="setPromptText(this)">Give me 3 hooks for tomorrow</button>
        <button class="chip" onclick="setPromptText(this)">What's my strongest format?</button>
        <button class="chip" onclick="setPromptText(this)">Rate my last week</button>
      </div>

      <div class="section-title reveal">
        <div>
          <div class="eyebrow">FOR YOU</div>
          <h2 class="h3-serif">Recent teardowns</h2>
        </div>
        <a class="link-mini" href="#saved">All saved →</a>
      </div>

      <div class="feed" id="feed"></div>

      <div class="empty-hint reveal" id="empty-hint" hidden>
        <p>You haven't forwarded a video yet. Open <a href="https://t.me/getprecense_bot" target="_blank" rel="noopener">@getprecense_bot</a> in Telegram and send Precense any reel to get your first teardown.</p>
      </div>
    </section>

    <aside class="page-rail">
      <div class="rail-card card reveal in">
        <div class="rail-head">
          <div class="eyebrow">YOUR SIGNATURE</div>
          <span class="badge-soft badge-neutral"><span data-rail-count>0</span> videos</span>
        </div>
        <div class="rail-body">
          <div class="rail-item">
            <div class="rail-label">Dominant hooks</div>
            <div class="sig-chips" data-rail-hooks></div>
          </div>
          <hr class="hairline" />
          <div class="rail-item">
            <div class="rail-label">Dominant formats</div>
            <div class="sig-chips" data-rail-formats></div>
          </div>
          <hr class="hairline" />
          <div class="rail-item">
            <div class="rail-label">Common subjects</div>
            <div class="sig-chips" data-rail-subjects></div>
          </div>
        </div>
        <a class="rail-link" href="#profile">See full signature →</a>
      </div>

      <div class="rail-card card reveal in">
        <div class="eyebrow" style="margin-bottom:.75rem">PRECENSE LIVES IN</div>
        <div class="rail-channels">
          <div class="rail-channel">
            <span class="rail-ch-dot" style="background:#26a5e0"></span>
            <span>Telegram</span>
            <span class="badge-soft">Live</span>
          </div>
          <div class="rail-channel">
            <span class="rail-ch-dot" style="background:#25d366"></span>
            <span>WhatsApp</span>
            <span class="badge-soft badge-gold">Soon</span>
          </div>
          <div class="rail-channel">
            <span class="rail-ch-dot" style="background:linear-gradient(135deg,#f58529,#dd2a7b)"></span>
            <span>Instagram DM</span>
            <span class="badge-soft badge-neutral">Gated</span>
          </div>
        </div>
        <a class="rail-link" href="https://t.me/getprecense_bot" target="_blank" rel="noopener">Open the bot →</a>
      </div>
    </aside>
  </div>
</template>

<template id="tpl-profile-legacy">
  <div class="page-single">
    <section class="profile-hero reveal in">
      <div class="profile-cover"></div>
      <div class="profile-cover-content">
        <div class="profile-avatar-lg" data-profile-initial>P</div>
        <div>
          <div class="eyebrow">PROFILE</div>
          <h1 class="h1-lg">The more Precense sees,<br/>the <em>sharper</em> it gets.</h1>
          <p class="lede" style="margin-top:.75rem">Every video you forward teaches your signature. Here's what Precense has learned so far.</p>
        </div>
      </div>
    </section>

    <div class="profile-grid">
      <div class="profile-col">
        <div class="settings-group-title">THE BASICS</div>
        <div class="settings-group reveal in">
          <div class="settings-row">
            <div class="settings-row-label">Name</div>
            <div class="settings-row-value" data-profile-name>—</div>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">Handle</div>
            <div class="settings-row-value" data-profile-handle>—</div>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">Niche</div>
            <div class="settings-row-value">
              <span data-profile-niche>app-ugc</span>
              <span class="settings-row-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>
            </div>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">Videos analyzed</div>
            <div class="settings-row-value" data-profile-count>0</div>
          </div>
        </div>

        <div class="settings-group-title">CHANNELS</div>
        <div class="settings-group reveal in">
          <div class="settings-row">
            <div class="settings-row-label">Telegram</div>
            <div class="settings-row-value"><span class="badge-soft"><span class="dot" style="color:var(--accent)"></span>Live</span></div>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">WhatsApp</div>
            <div class="settings-row-value"><span class="badge-soft badge-gold">Soon</span></div>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">Instagram DM</div>
            <div class="settings-row-value"><span class="badge-soft badge-neutral">Gated · Meta review</span></div>
          </div>
        </div>
      </div>

      <div class="profile-col">
        <div class="settings-group-title">YOUR SIGNATURE</div>
        <div class="signature-card card reveal in">
          <div class="sig-row">
            <div class="sig-label">Dominant hooks</div>
            <div class="sig-chips" data-sig-hooks></div>
          </div>
          <hr class="hairline" />
          <div class="sig-row">
            <div class="sig-label">Dominant formats</div>
            <div class="sig-chips" data-sig-formats></div>
          </div>
          <hr class="hairline" />
          <div class="sig-row">
            <div class="sig-label">Common subjects</div>
            <div class="sig-chips" data-sig-subjects></div>
          </div>
          <hr class="hairline" />
          <div class="sig-row">
            <div class="sig-label">Top performers</div>
            <div class="sig-perf" data-sig-perf></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-settings-legacy">
  <div class="page-single-narrow">
    <div class="hero-block reveal in">
      <div class="eyebrow">SETTINGS</div>
      <h1 class="h1-lg">Fine-<em>tune</em>.</h1>
    </div>

    <div class="settings-group-title">SUBSCRIPTION</div>
    <div class="settings-group reveal in">
      <div class="settings-row">
        <div class="settings-row-label">Plan</div>
        <div class="settings-row-value">Waitlist · early access</div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Model</div>
        <div class="settings-row-value">Claude Haiku 4.5</div>
      </div>
    </div>

    <div class="settings-group-title">LEGAL</div>
    <div class="settings-group reveal in">
      <div class="settings-row">
        <div class="settings-row-label">Terms of Service</div>
        <div class="settings-row-value settings-row-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div>
      </div>
      <div class="settings-row">
        <div class="settings-row-label">Privacy Policy</div>
        <div class="settings-row-value settings-row-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div>
      </div>
    </div>

    <div class="settings-group-title">DANGER ZONE</div>
    <div class="settings-group reveal in">
      <div class="settings-row" onclick="openSheet('delete')">
        <div class="settings-row-label settings-row-danger">Delete account</div>
        <div class="settings-row-value settings-row-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-saved-legacy">
  <div class="page-single-narrow">
    <div class="hero-block reveal in">
      <div class="eyebrow">SAVED</div>
      <h1 class="h1-lg">Your <em>keepers</em>.</h1>
      <p class="lede">Cards you've hearted show up here. Tap any card in your feed to save it.</p>
    </div>
    <div class="empty-hint reveal in">
      <p>Nothing saved yet.</p>
    </div>
  </div>
</template>

<!-- Bottom sheet -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet" role="dialog" aria-hidden="true"></aside>

<!-- Onboarding sheet template (post-auth Telegram link) -->
<template id="tpl-team-home">
  <div class="page-grid">
    <section class="page-main">
      <div class="hero-block reveal in">

        <h1 class="h1-lg">Manage your <em>roster</em>.</h1>

      <div class="stat-row reveal">
        <div class="stat-card"><div class="stat-num" data-team-count>0</div><div class="stat-label">Creators on team</div></div>
        <div class="stat-card"><div class="stat-num" data-team-invites-open>0</div><div class="stat-label">Open invites</div></div>

      </div>
      <div class="section-head reveal">
        <h2 class="h2">Roster</h2>
        <button class="btn btn-primary" onclick="openGenerateInviteSheet()">+ Invite creator</button>
      </div>
      <div id="team-roster" class="card-list reveal"></div>
    </section>
  </div>
</template>

<template id="tpl-team-roster">
  <div class="page-grid">
    <section class="page-main">
      <div class="section-head reveal in">
        <h1 class="h1-lg">Roster</h1>
        <button class="btn btn-primary" onclick="openGenerateInviteSheet()">+ Invite creator</button>
      </div>
      <div id="team-roster" class="card-list reveal"></div>
    </section>
  </div>
</template>

<template id="tpl-invites">
  <div class="page-grid">
    <section class="page-main">
      <div class="section-head reveal in">
        <h1 class="h1-lg">Invites</h1>
        <button class="btn btn-primary" onclick="openGenerateInviteSheet()">+ Generate</button>
      </div>
      <div id="invites-list" class="card-list reveal"></div>
    </section>
  </div>
</template>

<template id="tpl-admin-home">
  <div class="page-grid">
    <section class="page-main">
      <div class="hero-block reveal in">
        <div class="eyebrow">PLATFORM · ADMIN</div>
        <h1 class="h1-lg">Precense <em>ops</em>.</h1>
      </div>
      <div class="stat-row reveal">
        <div class="stat-card"><div class="stat-num" data-admin-teams-count>0</div><div class="stat-label">Teams</div></div>
        <div class="stat-card"><div class="stat-num" data-admin-brands-count>0</div><div class="stat-label">Brand orgs</div></div>
        <div class="stat-card"><div class="stat-num">$0</div><div class="stat-label">Platform revenue</div></div>
      </div>
      <div class="section-head reveal">
        <h2 class="h2">Teams</h2>
        <button class="btn btn-primary" onclick="openCreateTeamSheet()">+ New team</button>
      </div>
      <div id="admin-teams" class="card-list reveal"></div>
    </section>
  </div>
</template>

<template id="tpl-admin-legacy">
  <div class="page-grid">
    <section class="page-main">
      <div class="section-head reveal in">
        <h1 class="h1-lg">Admin</h1>
        <div style="display:flex; gap:.5rem;">
          <button class="btn" onclick="openCreateTeamSheet()">+ Team</button>
          <button class="btn btn-primary" onclick="openGenerateInviteSheet()">+ Invite</button>
        </div>
      </div>
      <h2 class="h2 reveal">Recent invites</h2>
      <div id="admin-recent-invites" class="card-list reveal"></div>
    </section>
  </div>
</template>

<template id="tpl-generate-invite">
  <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></div>
  <h2 class="sheet-title">Generate <em>invite</em>.</h2>
  <form onsubmit="event.preventDefault(); submitGenerateInvite(this);" style="display:flex; flex-direction:column; gap:.75rem;">
    <label style="display:flex; flex-direction:column; gap:.3rem;">
      <span style="font-size:.85rem; opacity:.7;">Role</span>
      <select name="role" class="pill-input" style="padding:.6rem .8rem;">
        <option value="creator">Creator</option>
        <option value="team_lead">Team lead (admin only)</option>
        <option value="brand">Brand (admin only)</option>
      </select>
    </label>
    <input type="hidden" name="team_id" data-invite-team-id value="" />
    <label style="display:flex; flex-direction:column; gap:.3rem;">
      <span style="font-size:.85rem; opacity:.7;">Team take % (0–50, blank = team default)</span>
      <input class="pill-input" style="padding:.6rem .8rem;" type="number" name="team_take_pct" min="0" max="50" step="0.5" placeholder="e.g. 20" data-invite-default-pct />
    </label>
    <label style="display:flex; flex-direction:column; gap:.3rem;">
      <span style="font-size:.85rem; opacity:.7;">Email hint (optional)</span>
      <input class="pill-input" style="padding:.6rem .8rem;" type="email" name="email_hint" placeholder="creator@example.com" />
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Create invite link</button>
    <div class="signin-error" id="invite-err" hidden></div>
  </form>
  <span class="sheet-not-now" onclick="closeSheet()">Cancel</span>
</template>

<template id="tpl-create-team">
  <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
  <h2 class="sheet-title">New <em>team</em>.</h2>
  <p class="sheet-body">Promotes the owner to team_lead if they aren't already.</p>
  <form onsubmit="event.preventDefault(); submitCreateTeam(this);" style="display:flex; flex-direction:column; gap:.75rem;">
    <input class="pill-input" style="padding:.6rem .8rem;" type="text" name="name" placeholder="Team name" required />
    <input class="pill-input" style="padding:.6rem .8rem;" type="email" name="owner_email" placeholder="Owner email (must be an existing user)" required />
    <input class="pill-input" style="padding:.6rem .8rem;" type="number" name="default_team_take_pct" min="0" max="50" step="0.5" value="20" placeholder="Default team take %" />
    <button class="btn btn-primary btn-lg" type="submit">Create team</button>
    <div class="signin-error" id="team-err" hidden></div>
  </form>
  <span class="sheet-not-now" onclick="closeSheet()">Cancel</span>
</template>

<template id="tpl-chats">
  <div class="chats-shell">
    <aside class="chats-side">
      <div class="chats-side-head">
        <h2>Chats</h2>
        <button class="btn btn-primary" onclick="openNewChatSheet()">+ New</button>

      <div id="chat-list" class="chat-list"></div>
    </aside>
    <section id="chat-pane" class="chat-pane"><div class="empty-block"><p class="muted">Pick a chat or start a new one.</p></div></section>

</template>

  <div class="page-grid">

</template>

</template>

<template id="tpl-new-campaign">
  <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></div>
  <h2 class="sheet-title">New <em>campaign</em>.</h2>
  <p class="sheet-body">Give it a name and a one-line brief. You can refine hooks, budget, and dates later.</p>
  <form onsubmit="event.preventDefault(); submitNewCampaign(this);" style="display:flex; flex-direction:column; gap:.75rem;">
    <label class="pill-input" style="width:100%">
      <input name="name" type="text" placeholder="Campaign name" required autocomplete="off" />
    </label>
    <label class="pill-input" style="width:100%">
      <input name="brief" type="text" placeholder="One-line brief (optional)" autocomplete="off" />
    </label>
    <label class="pill-input" style="width:100%">
      <input name="target_hooks" type="text" placeholder="Target hooks, comma-separated (optional)" autocomplete="off" />
    </label>
    <button class="btn btn-primary btn-lg" type="submit">Create campaign</button>
    <div class="signin-error" id="campaign-err" hidden></div>
  </form>
  <span class="sheet-not-now" onclick="closeSheet()">Cancel</span>
</template>

<template id="tpl-onboard-role">
  <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
  <h2 class="sheet-title">Who's using <em>Precense</em>?</h2>
  <p class="sheet-body">Pick the workspace you want. You can add the other one later.</p>

  <div class="role-picker" style="display:flex; flex-direction:column; gap:.75rem; margin-top:.5rem;">
    <button type="button" class="role-card" data-role="creator" onclick="selectRole('creator')">
      <div class="role-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>
      <div class="role-card-body">
        <div class="role-card-title">I'm a creator</div>
        <div class="role-card-sub">Track your posts, learn your signature, get told what to make next.</div>
      </div>
    </button>
    <button type="button" class="role-card" data-role="brand" onclick="selectRole('brand')">
      <div class="role-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V12h6v9"/></svg></div>
      <div class="role-card-body">
        <div class="role-card-title">I run a brand</div>
        <div class="role-card-sub">Manage UGC creators, brief campaigns, review deliverables, track performance.</div>
      </div>
    </button>
  </div>

  <form id="brand-name-form" hidden onsubmit="event.preventDefault(); submitRole('brand', this);" style="display:flex; flex-direction:column; gap:.75rem; margin-top:1rem;">
    <label class="pill-input" style="width:100%">
      <input name="brand_name" type="text" placeholder="Brand name" autocapitalize="words" autocomplete="organization" required />
      <button class="pill-input-send" type="submit" aria-label="Create workspace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </label>
  </form>

  <div class="signin-error" id="role-err" hidden></div>
</template>

<template id="tpl-link-sheet">
  <div class="sheet-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg></div>
  <h2 class="sheet-title">Link your <em>Telegram</em>.</h2>
  <p class="sheet-body">Enter the Telegram username you use to DM Precense so we can pair your account with your forwards. You can skip and add it later.</p>
  <form onsubmit="event.preventDefault(); linkHandleSubmit(this);" style="display:flex; flex-direction:column; gap:.75rem;">
    <div class="pill-input" style="width:100%">
      <input type="text" placeholder="@your_telegram_handle" autocapitalize="off" autocomplete="off" spellcheck="false" required />
      <button class="pill-input-send" type="submit" aria-label="Link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>
    <div class="signin-error" id="link-err" hidden></div>
  </form>
  <span class="sheet-not-now" onclick="closeSheet()">Skip for now</span>
</template>

<script src="/js/auth.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
