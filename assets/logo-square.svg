<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Precense">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5efe0"/>
      <stop offset="1" stop-color="#ece1c9"/>
    </linearGradient>
    <radialGradient id="glow-tl" cx="18%" cy="18%" r="65%">
      <stop offset="0" stop-color="#14402f" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#14402f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br" cx="85%" cy="85%" r="65%">
      <stop offset="0" stop-color="#a97e3d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#a97e3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Warm beige gradient canvas -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow-tl)"/>
  <rect width="1024" height="1024" fill="url(#glow-br)"/>

  <!-- Viewfinder mark, centered, deep hunter green -->
  <g transform="translate(512, 512)">
    <!-- Corner brackets (viewBox 320 wide, so brackets span ~240 for a large centered mark) -->
    <g fill="none" stroke="#14402f" stroke-width="14" stroke-linecap="round">
      <path d="M -160 -120 L -160 -160 L -120 -160"/>
      <path d="M  160 -120 L  160 -160 L  120 -160"/>
      <path d="M -160  120 L -160  160 L -120  160"/>
      <path d="M  160  120 L  160  160 L  120  160"/>
    </g>
    <!-- Italic serif P -->
    <text x="0" y="80" text-anchor="middle" font-family="'Instrument Serif','Times New Roman',serif" font-style="italic" font-size="220" fill="#14402f">P</text>
  </g>
</svg>
